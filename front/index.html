<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Something Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>なんでも記録する</h1>

    <div class="toolbar">
      <button type="button" id="open-add-modal-button">追加</button>
    </div>

    <div class="table-wrapper">
      <table>
        <caption class="visually-hidden">ログ一覧</caption>
        <thead>
          <tr>
            <th>ID</th>
            <th>日付</th>
            <th>カテゴリ</th>
            <th>記録内容</th>
            <th>ステータス</th>
            <th>重要度</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="log-list"></tbody>
      </table>
    </div>
  </main>

  <dialog id="log-modal" class="modal">
    <form id="log-form" class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">ログ追加</h2>
      </div>

      <div class="modal-body">
        <div class="form-field">
          <label for="logged-date">日付</label>
          <input type="date" id="logged-date" required>
        </div>

        <div class="form-field">
          <label for="category">カテゴリ</label>
          <input type="text" id="category" required>
        </div>

        <div class="form-field">
          <label for="content">記録内容</label>
          <textarea id="content" required></textarea>
        </div>

        <div class="form-field">
          <label for="status">ステータス</label>
          <select id="status" required>
            <option value="todo">todo</option>
            <option value="doing">doing</option>
            <option value="done">done</option>
          </select>
        </div>

        <div class="form-field">
          <label for="importance">重要度</label>
          <input type="number" id="importance" min="1" max="5" value="3" required>
        </div>
      </div>

      <div class="modal-buttons">
        <button type="submit" id="submit-log-button">追加する</button>
        <button type="button" id="close-modal-button" class="button-secondary">キャンセル</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
